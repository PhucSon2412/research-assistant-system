# M8a minimal CI: an explicit API selection (not the full suite), web
# tests/typecheck/build and the pilot deploy contract. No .env, no real account,
# no provider/arXiv key: tests run against throwaway PostgreSQL/Redis/MinIO
# containers with random per-run credentials; pytest refuses outbound HTTP
# except loopback (scripts/m8a_test_host.py). No continue-on-error: a failing
# step fails the job after the evidence step ran.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API selection (config, auth, invitation/reset/delivery, limiter, migrations, C4 contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API with dev extras, pinned to the accepted image rc2
        # Same parser/library versions as the running image (pypdf 6.21.1); dev-only extras keep their ranges.
        run: python -m pip install -c api/constraints-rc2.txt -e "./api[dev]"
      - name: Start isolated PostgreSQL/Redis/MinIO
        # PostgreSQL/Redis/MinIO come from the digests pinned in deploy/compose.yaml (pulled fresh on the runner).
        run: python scripts/m8a_test_host.py --context "$RUNNER_TEMP/m8a-api" setup
      - name: Run API selection
        # Why each file: config and new M8a modules; session/CSRF/Origin/cookies;
        # invitation and reset runtime/journal/compensation (delivery boundary);
        # provenance/receipts and auth safety; migrations/ORM; C4 contract/health;
        # M8b journal replica, encrypted backups/retention, alerts, host entrypoint, real MinIO;
        # M7c: the evaluation CLI/runner, the AI judge track and the live tooling (offline only:
        # the outbound-HTTP guard stays; live runs are manual scripts with a ledger, never CI).
        # Deselected: one dump/restore round that needs the C3 host container fixture.
        run: >-
          python scripts/m8a_test_host.py --context "$RUNNER_TEMP/m8a-api" test
          --junit "$RUNNER_TEMP/m8a-api/junit-api.xml" --
          tests/test_config.py tests/test_m8a_smtp_delivery.py tests/test_m8a_rate_limit.py
          tests/test_m8a_smtp_deadline.py tests/test_m8a_ci_guard.py
          tests/test_m8a_auth_delivery.py tests/test_csrf_and_cookies.py tests/test_c2a_origin.py
          tests/test_auth_sessions.py tests/test_c2a_login_sessions.py tests/test_auth_secrets.py
          tests/test_invitations.py tests/test_invitation_journal.py tests/test_c2c2_invitations.py
          tests/test_password_reset.py tests/test_c2b_reset_status.py tests/test_reset_token_journal.py
          tests/test_session_revocation_journal.py tests/test_pre_c4_initial_receipts.py
          tests/test_auth_safety_foundation.py tests/test_c2c1_bootstrap.py tests/test_migrations.py
          tests/test_c4_contract.py tests/test_health.py
          tests/test_m8b_replica.py tests/test_m8b_artifacts.py tests/test_m8b_alerts.py
          tests/test_m8b_ops_host.py tests/test_m8b_s3_minio.py
          tests/test_evaluation.py tests/test_m7c_ai_review.py tests/test_m7c_tooling.py
          --deselect tests/test_pre_c4_initial_receipts.py::test_two_dump_restore_rounds_keep_valid_provenance_and_restrict_forgery
      - name: Scan JUnit for context secrets before upload
        # Runs even when tests failed, so clean failure evidence stays available.
        # Only scanned bytes reach the publish directory, and only on a clean scan.
        id: scan
        if: always()
        run: >-
          python scripts/m8a_ci_scan.py --context "$RUNNER_TEMP/m8a-api"
          --publish-dir "$RUNNER_TEMP/m8a-publish" "$RUNNER_TEMP/m8a-api/junit-api.xml"
      - name: Upload scanned JUnit
        # Publishes only what the scan step wrote after a clean result; a failed,
        # missing or skipped scan publishes nothing (raw files are never uploaded).
        if: ${{ !cancelled() && steps.scan.outputs.clean == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-api
          path: ${{ runner.temp }}/m8a-publish/junit-api.xml
          if-no-files-found: error
          retention-days: 14
      - name: Stop test containers
        if: always()
        run: python scripts/m8a_test_host.py --context "$RUNNER_TEMP/m8a-api" cleanup

  web:
    name: Web tests, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm test --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-config:
    name: Pilot deploy config contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the API image (validates Settings inside it)
        run: docker build -t ras-ci-api:check api
      - name: Compose contract, production Settings in the image, registry resolution of pulled images
        run: python scripts/m8a_deploy_check.py --settings-image ras-ci-api:check --check-registry
      - name: M8b ops image installs the hash-pinned age library on top of the API image
        run: |
          docker build --build-arg RAS_API_IMAGE=ras-ci-api:check -t ras-ci-ops:check deploy/ops
          docker run --rm --network none ras-ci-ops:check python -c "import pyrage, app.ops.artifacts, app.cli.ops; print('ops image ok')"
      - name: Caddyfile validates with a placeholder edge token
        run: |
          mkdir -p "$RUNNER_TEMP/edge" && printf 'placeholder-edge-token-for-validate-only' > "$RUNNER_TEMP/edge/edge_token"
          docker run --rm --network none -e RAS_PUBLIC_HOST=ras.example.org -e RAS_HSTS_MAX_AGE=86400 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/deploy/caddy/tls.d:/etc/caddy/tls.d:ro" \
            -v "$RUNNER_TEMP/edge/edge_token:/run/secrets/edge_token:ro" -v "$RUNNER_TEMP/edge:/etc/caddy/maintenance:ro" \
            caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
