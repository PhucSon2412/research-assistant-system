[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ras-api"
version = "0.1.0"
description = "Research Assistant System API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
    "argon2-cffi>=23.1,<26",
    "boto3>=1.35,<2",
    "pypdf>=5,<7",
    "celery[redis]>=5.4,<6",
    "pgvector>=0.4,<1",
    "httpx>=0.27,<1",
    "defusedxml>=0.7,<1",
    "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "httpx>=0.27,<1",
    "reportlab>=4,<5",
    "cryptography>=42",
    "pyyaml>=6",
    # M8b: age encryption, same pin as deploy/ops/requirements.txt
    "pyrage==1.4.0",
    # M12: parallel test workers (pinned in constraints-dev.txt)
    "pytest-xdist>=3.6,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: full tier only (push main, nightly, workflow_dispatch): dump/restore rounds, the evaluation ACL matrix, tests that need a host container (docs/m12-fast-ci.md)",
    "timing: wall-clock bound below a few seconds; the harness runs these after the xdist phase, without parallel load",
]
