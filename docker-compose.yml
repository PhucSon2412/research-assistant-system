# Development stack (M1a–M6c-1). Copy .env.example to .env and fill every secret
# before `docker compose up`; required values have no fallback on purpose.
# Host ports bind to 127.0.0.1 only.

name: ras

# Connection parts are passed separately and assembled with SQLAlchemy's
# URL.create(), so passwords containing URL delimiters (@ : / ? # %) work.
x-db-env: &db-env
  RAS_DB__HOST: db
  RAS_DB__PORT: "5432"
  RAS_DB__USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  RAS_DB__PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  RAS_DB__NAME: ${POSTGRES_DB:?set POSTGRES_DB in .env}

# M6c-1 revocation journal: kept OUT of the db-data and minio-data volumes (and
# out of their backups), so restoring those does not roll it back. A separate
# named volume is only a dev trial: `docker compose down -v` deletes it with
# the rest, and one disk still loses all three together. RAS_JOURNAL_SOURCE may
# name a host directory instead (smoke scripts that read it from the host).
x-journal-env: &journal-env
  RAS_RECOVERY__JOURNAL_PATH: /var/lib/ras/journal/revocations.jsonl
x-journal-volume: &journal-volume ${RAS_JOURNAL_SOURCE:-revocation-journal}:/var/lib/ras/journal

services:
  db:
    # PostgreSQL 16 with the pgvector extension available; the first
    # migration runs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Broker for Celery from M2; not used by application code in M1a.
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # redis-cli reads the password from here, keeping it out of argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # S3-compatible object store; the S3 adapter arrives in M1c.
    # Docker Hub no longer serves minio/minio; the official image is on
    # quay.io. Pinned so dev environments are reproducible.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    # One-shot: applies Alembic migrations, then exits. `api` waits for it.
    build: ./api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  recovery-init:
    # One-shot, after migrate: registers a NEW, empty database with a new
    # journal. It changes nothing (exit 0) for a registered database, one with
    # content, or when a journal already exists: a restored database is never
    # taken for a new install. Until the database and the journal agree, the
    # API serves only /healthz (/readyz is 503) and workers process nothing;
    # see docs/dev-setup.md ("Cleanup và restore").
    build: ./api
    command: ["python", "-m", "app.cli.recovery", "init", "--if-new"]
    environment:
      <<: [*db-env, *journal-env]
    volumes:
      - *journal-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: ./api
    environment:
      <<: [*db-env, *journal-env]
      # Development only: plain HTTP, non-Secure cookies and the in-memory dev
      # outbox are hardcoded here on purpose. This file is not a deployment
      # config and cannot be turned into one by setting variables; see
      # docs/dev-setup.md ("Trước khi đưa lên server").
      RAS_ENVIRONMENT: development
      RAS_HTTP__COOKIE_SECURE: "false"
      RAS_HTTP__PUBLIC_BASE_URL: http://127.0.0.1:${WEB_HOST_PORT:-3000}
      RAS_HTTP__ALLOWED_ORIGINS: '["http://127.0.0.1:${WEB_HOST_PORT:-3000}","http://localhost:${WEB_HOST_PORT:-3000}"]'
      # Invitation/reset links are kept in API memory for an Admin to read
      # at /admin (single process; emptied on restart). Real channel: open.
      RAS_DELIVERY__MODE: dev_outbox
      RAS_EMBEDDING__API_KEY: ${OPENROUTER_API_KEY:-}
      RAS_EMBEDDING__PRICING_VERIFIED: ${RAS_EMBEDDING__PRICING_VERIFIED:-false}
      RAS_EMBEDDING__MAX_USD_PER_MILLION_TOKENS: ${RAS_EMBEDDING__MAX_USD_PER_MILLION_TOKENS:-0.10}
      RAS_EMBEDDING__MAX_CONCURRENT_REQUESTS: ${RAS_EMBEDDING__MAX_CONCURRENT_REQUESTS:-2}
      RAS_EMBEDDING__RESERVATION_LEASE_SECONDS: ${RAS_EMBEDDING__RESERVATION_LEASE_SECONDS:-90}
      RAS_RERANK__PRICING_VERIFIED: ${RAS_RERANK__PRICING_VERIFIED:-false}
      RAS_RERANK__MAX_USD_PER_MILLION_TOKENS: ${RAS_RERANK__MAX_USD_PER_MILLION_TOKENS:-0.20}
      RAS_RERANK__MAX_CONCURRENT_REQUESTS: ${RAS_RERANK__MAX_CONCURRENT_REQUESTS:-2}
      RAS_RERANK__RESERVATION_LEASE_SECONDS: ${RAS_RERANK__RESERVATION_LEASE_SECONDS:-60}
      RAS_GENERATION__PRICING_VERIFIED: ${RAS_GENERATION__PRICING_VERIFIED:-false}
      RAS_GENERATION__MAX_INPUT_USD_PER_MILLION_TOKENS: ${RAS_GENERATION__MAX_INPUT_USD_PER_MILLION_TOKENS:-2.0}
      RAS_GENERATION__MAX_OUTPUT_USD_PER_MILLION_TOKENS: ${RAS_GENERATION__MAX_OUTPUT_USD_PER_MILLION_TOKENS:-10.0}
      RAS_GENERATION__MAX_CONCURRENT_REQUESTS: ${RAS_GENERATION__MAX_CONCURRENT_REQUESTS:-2}
      RAS_GENERATION__RESERVATION_LEASE_SECONDS: ${RAS_GENERATION__RESERVATION_LEASE_SECONDS:-100}
      RAS_BUDGET__APP_DAILY_USD: ${RAS_BUDGET__APP_DAILY_USD:-10.0}
      RAS_BUDGET__EMBEDDING_DAILY_USD: ${RAS_BUDGET__EMBEDDING_DAILY_USD:-3.0}
      RAS_BUDGET__RERANK_DAILY_USD: ${RAS_BUDGET__RERANK_DAILY_USD:-2.0}
      RAS_BUDGET__GENERATION_DAILY_USD: ${RAS_BUDGET__GENERATION_DAILY_USD:-5.0}
      RAS_BUDGET__USER_EMBEDDING_DAILY_USD: ${RAS_BUDGET__USER_EMBEDDING_DAILY_USD:-1.0}
      RAS_BUDGET__USER_RERANK_DAILY_USD: ${RAS_BUDGET__USER_RERANK_DAILY_USD:-0.5}
      RAS_BUDGET__USER_GENERATION_DAILY_USD: ${RAS_BUDGET__USER_GENERATION_DAILY_USD:-1.0}
      RAS_BUDGET__EMBEDDING_WARNING_FRACTION: ${RAS_BUDGET__EMBEDDING_WARNING_FRACTION:-0.8}
      RAS_BUDGET__RERANK_WARNING_FRACTION: ${RAS_BUDGET__RERANK_WARNING_FRACTION:-0.8}
      RAS_BUDGET__GENERATION_WARNING_FRACTION: ${RAS_BUDGET__GENERATION_WARNING_FRACTION:-0.8}
      RAS_STORAGE__ENDPOINT_URL: http://minio:9000
      RAS_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      RAS_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      RAS_STORAGE__BUCKET: ras-originals
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - *journal-volume
    depends_on:
      recovery-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: ./api
    command: ["celery", "-A", "app.ingest.celery_app:celery_app", "worker", "--loglevel=WARNING", "--concurrency=2"]
    environment:
      <<: [*db-env, *journal-env]
      RAS_REDIS_HOST: redis
      RAS_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      RAS_DISCOVERY__ENABLED: ${RAS_DISCOVERY__ENABLED:-true}
      RAS_DISCOVERY__TOPICS: ${RAS_DISCOVERY__TOPICS:-["cs.AI","cs.LG","cs.CL"]}
      RAS_DISCOVERY__INITIAL_LOOKBACK_DAYS: ${RAS_DISCOVERY__INITIAL_LOOKBACK_DAYS:-7}
      RAS_DISCOVERY__MAX_PAGES_PER_TOPIC: ${RAS_DISCOVERY__MAX_PAGES_PER_TOPIC:-2}
      RAS_DISCOVERY__POLL_SECONDS: ${RAS_DISCOVERY__POLL_SECONDS:-86400}
      RAS_DISCOVERY__MAX_RESPONSE_BYTES: ${RAS_DISCOVERY__MAX_RESPONSE_BYTES:-4194304}
      RAS_DISCOVERY__TIMEOUT_SECONDS: ${RAS_DISCOVERY__TIMEOUT_SECONDS:-20}
      RAS_DISCOVERY__MIN_REQUEST_INTERVAL_SECONDS: ${RAS_DISCOVERY__MIN_REQUEST_INTERVAL_SECONDS:-3}
      RAS_EMBEDDING__API_KEY: ${OPENROUTER_API_KEY:-}
      RAS_EMBEDDING__PRICING_VERIFIED: ${RAS_EMBEDDING__PRICING_VERIFIED:-false}
      RAS_EMBEDDING__MAX_USD_PER_MILLION_TOKENS: ${RAS_EMBEDDING__MAX_USD_PER_MILLION_TOKENS:-0.10}
      RAS_EMBEDDING__MAX_CONCURRENT_REQUESTS: ${RAS_EMBEDDING__MAX_CONCURRENT_REQUESTS:-2}
      RAS_EMBEDDING__RESERVATION_LEASE_SECONDS: ${RAS_EMBEDDING__RESERVATION_LEASE_SECONDS:-90}
      RAS_BUDGET__APP_DAILY_USD: ${RAS_BUDGET__APP_DAILY_USD:-10.0}
      RAS_BUDGET__EMBEDDING_DAILY_USD: ${RAS_BUDGET__EMBEDDING_DAILY_USD:-3.0}
      RAS_BUDGET__RERANK_DAILY_USD: ${RAS_BUDGET__RERANK_DAILY_USD:-2.0}
      RAS_BUDGET__GENERATION_DAILY_USD: ${RAS_BUDGET__GENERATION_DAILY_USD:-5.0}
      RAS_BUDGET__EMBEDDING_WARNING_FRACTION: ${RAS_BUDGET__EMBEDDING_WARNING_FRACTION:-0.8}
      RAS_BUDGET__USER_EMBEDDING_DAILY_USD: ${RAS_BUDGET__USER_EMBEDDING_DAILY_USD:-1.0}
      RAS_BUDGET__USER_EMBEDDING_WARNING_FRACTION: ${RAS_BUDGET__USER_EMBEDDING_WARNING_FRACTION:-0.8}
      RAS_STORAGE__ENDPOINT_URL: http://minio:9000
      RAS_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      RAS_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      RAS_STORAGE__BUCKET: ras-originals
    volumes:
      - *journal-volume
    depends_on:
      recovery-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./api
    command: ["celery", "-A", "app.ingest.celery_app:celery_app", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: [*db-env, *journal-env]
      RAS_REDIS_HOST: redis
      RAS_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      RAS_DISCOVERY__ENABLED: ${RAS_DISCOVERY__ENABLED:-true}
      RAS_DISCOVERY__TOPICS: ${RAS_DISCOVERY__TOPICS:-["cs.AI","cs.LG","cs.CL"]}
      RAS_DISCOVERY__INITIAL_LOOKBACK_DAYS: ${RAS_DISCOVERY__INITIAL_LOOKBACK_DAYS:-7}
      RAS_DISCOVERY__MAX_PAGES_PER_TOPIC: ${RAS_DISCOVERY__MAX_PAGES_PER_TOPIC:-2}
      RAS_DISCOVERY__POLL_SECONDS: ${RAS_DISCOVERY__POLL_SECONDS:-86400}
      RAS_DISCOVERY__MAX_RESPONSE_BYTES: ${RAS_DISCOVERY__MAX_RESPONSE_BYTES:-4194304}
      RAS_DISCOVERY__TIMEOUT_SECONDS: ${RAS_DISCOVERY__TIMEOUT_SECONDS:-20}
      RAS_DISCOVERY__MIN_REQUEST_INTERVAL_SECONDS: ${RAS_DISCOVERY__MIN_REQUEST_INTERVAL_SECONDS:-3}
      RAS_EMBEDDING__API_KEY: ${OPENROUTER_API_KEY:-}
      RAS_EMBEDDING__PRICING_VERIFIED: ${RAS_EMBEDDING__PRICING_VERIFIED:-false}
    volumes:
      - *journal-volume
    depends_on:
      recovery-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    environment:
      # Server-side only; the browser never talks to the DB or holds secrets.
      API_INTERNAL_URL: http://api:8000
      # JSON proxy deadlines (headers and body), integer seconds 1-300. The
      # provider budget covers POST /search and POST /rag/ask and must stay
      # above the API's embedding + generation timeouts; see docs/dev-setup.md.
      WEB_PROXY_TIMEOUT_SECONDS: ${WEB_PROXY_TIMEOUT_SECONDS:-15}
      WEB_PROXY_PROVIDER_TIMEOUT_SECONDS: ${WEB_PROXY_PROVIDER_TIMEOUT_SECONDS:-120}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db-data:
  redis-data:
  minio-data:
  revocation-journal:
